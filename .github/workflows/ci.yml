name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hht
          POSTGRES_PASSWORD: hht
          POSTGRES_DB: hht_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hht"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAUSHALTTICKETS_TEST_DATABASE_URL: postgresql+psycopg://hht:hht@127.0.0.1:5432/hht_test
      HAUSHALTTICKETS_TEST_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --extra test pytest -q
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Shell scripts
        working-directory: .
        run: shellcheck deploy/proxmox/*.sh deploy/lxc/*.sh deploy/lxc/haushalttickets-*

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hht
          POSTGRES_PASSWORD: hht
          POSTGRES_DB: hht_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hht"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAUSHALTTICKETS_TEST_DATABASE_URL: postgresql+psycopg://hht:hht@127.0.0.1:5432/hht_test
      HAUSHALTTICKETS_TEST_REQUIRE_DB: "1"
      HAUSHALTTICKETS_SERVER_PYTHON: ${{ github.workspace }}/server/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Server environment (Python of Debian 13)
        working-directory: server
        run: uv sync --frozen --no-dev --python 3.13
      - name: Home Assistant test harness
        run: uv venv .venv-ha --python 3.14 && uv pip install --python .venv-ha -r requirements_test.txt
      - run: .venv-ha/bin/python -m pytest -q

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/haushalttickets/frontend/haushalttickets-card.js
      - name: Smoke test in jsdom
        run: |
          npm install --no-save --prefix tests/card jsdom@24
          node tests/card/smoke.mjs custom_components/haushalttickets/frontend/haushalttickets-card.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for integration
        id: integration
        run: test -f custom_components/haushalttickets/manifest.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.integration.outputs.present == 'true'
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for integration
        id: integration
        run: test -f custom_components/haushalttickets/manifest.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.integration.outputs.present == 'true'
        uses: hacs/action@main
        with:
          category: integration
          # Not listed in home-assistant/brands (yet).
          ignore: brands
