[project]
name = "haushalttickets-server"
dynamic = ["version"]
description = "Ticket server for Haushalttickets (runs in a Debian LXC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
haushalttickets-server = "haushalttickets_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/haushalttickets_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haushalttickets_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
